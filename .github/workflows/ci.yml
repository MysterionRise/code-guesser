name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes a pull request's run, but every merge to main gets a full run:
# main pushes are grouped by commit, because a shared group keeps only one pending run
# and cancels the rest even without cancel-in-progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  node:
    name: Node workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any high or critical advisory in the locked tree (#26); Dependabot (.github/dependabot.yml)
      # proposes the updates that clear them.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # The Node-to-Python seam test spawns the real locked workers in their offline request-check mode.
      # setup-uv publishes no major tags since v8, only immutable full-version tags.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.25"

      - name: Sync locked worker environment
        run: |
          uv python install 3.12
          uv sync --locked --project ops/poc/stack

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm --filter @codeguessr/game build

      - name: Typecheck
        run: pnpm typecheck

      - name: Accessibility checks
        run: pnpm test:a11y

      - name: Performance checks
        run: pnpm test:performance

      - name: Acquisition containment
        run: pnpm exec node --test tests/containment/acquisition-boundary.test.mjs

      # The boot checks drive the production build in Chromium too, so the browser is installed before them.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Starts the production build in public mode (#97): a missing setting exits 78 with its code and no value, and
      # every generative design plays under the nonce policy without one violation.
      - name: Boot checks
        run: pnpm test:deploy

      - name: Browser scenarios
        run: pnpm test:e2e

  # The container image the owner's server runs (#170), built from this checkout as Dokploy builds it.
  container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke script plays one game in Chromium against the running container.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the image
        run: docker build --tag codeguessr:ci .

      # Runs the image in public mode with a throwaway secret and volume: a missing secret or volume exits 78, and a
      # configured server runs as node, answers its health check, deals a game into its state store, and passes
      # ops/deploy/smoke.mjs and ops/deploy/pull-events.sh.
      - name: Container checks
        run: pnpm test:container
        env:
          CODEGUESSR_IMAGE: codeguessr:ci

  python:
    name: Stack worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.25"

      - name: Provision locked Python
        run: uv python install 3.12

      - name: Sync locked worker environment
        run: uv sync --locked --project ops/poc/stack

      - name: Worker unit tests
        run: uv run --project ops/poc/stack --locked python -m unittest discover -s ops/poc/stack
