# Version updates (#26, #27): once a month, minor and patch updates grouped into one pull request per
# ecosystem. npm majors are taken by hand, since they move the toolchain: `@types/node` follows the pinned Node
# runtime, and Next 16 renames `middleware.ts`. Other majors come one pull request each. Dependabot caps open pull
# requests per ecosystem, not overall.
# Security updates are a repository setting (#27) and keep their own limit.
version: 2
updates:
  # The pnpm workspace: root, apps/*, and packages/*, with pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The locked Stack worker (pyproject.toml and uv.lock). The worker journal is keyed to uv.lock's hash, so a lock
  # change orphans every recorded worker output and breaks `--offline` rebuilds: no routine version updates (a limit
  # of 0 keeps security updates). Move the lock by hand, between data runs.
  - package-ecosystem: uv
    directory: /ops/poc/stack
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]

  # The actions .github/workflows uses.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The container image's base, node:<version>-bookworm-slim pinned by digest (#170). Node's version is pinned across
  # the repository (.nvmrc, engines, CI, the README) and moves by hand; Dependabot only refreshes the digest when the
  # same tag is rebuilt, which brings Debian's security fixes.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
